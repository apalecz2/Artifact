<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-aware anchor glyph for modern browsers; PNGs fall back for the rest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/anchor-icon.png" />
    <link rel="apple-touch-icon" href="/anchor-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Anchor turns scanned PDFs and photographed tables into structured spreadsheets, 100% locally, with per-cell confidence scoring and click-to-source verification."
    />
    <meta property="og:title" content="Anchor: Local-first AI data extraction" />
    <meta
      property="og:description"
      content="Your documents. Your data. Your machine. Turn unstructured documents into verified structured data entirely offline."
    />
    <meta property="og:type" content="website" />
    <!-- Fonts are self-hosted and bundled by Vite (see main.tsx). Nothing here
         may reference a remote origin: the Privacy Policy (§4) tells visitors
         this site loads no third-party resources, and a <link> to Google Fonts
         would send every visitor's IP address and user-agent to Google. -->
    <title>Anchor · Local AI Data Extraction</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
